<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Page not found | apercue.ca</title>
<style>
:root {
  --bg: #0a0e14;
  --text: #b8c4d0;
  --text-dim: #5c6978;
  --text-bright: #e8ecf1;
  --accent: #3ddc84;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Atkinson Hyperlegible Next', system-ui, -apple-system, 'Segoe UI', sans-serif;
  min-height: 100vh;
  display: grid;
  place-items: center;
  padding: 24px;
}
main { max-width: 32rem; }
.code { font-family: ui-monospace, 'Atkinson Hyperlegible Mono', monospace; color: var(--text-dim); margin-bottom: 8px; }
h1 { color: var(--text-bright); font-size: 1.6rem; margin-bottom: 12px; }
p { line-height: 1.6; margin-bottom: 12px; }
a { color: var(--accent); }
</style>
</head>
<body>
<main>
  <div class="code">404</div>
  <h1>Page not found</h1>
  <p>This page does not exist, or it has been removed.</p>
  <p><a href="/">Go to the apercue.ca home page</a> or browse the
     <a href="https://github.com/quicue/apercue">source on GitHub</a>.</p>
</main>
</body>
</html>
