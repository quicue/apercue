name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install CUE
        uses: cue-lang/setup-cue@v1.0.1
        with:
          version: v0.15.4

      - name: Unified validation (all packages)
        run: |
          # Vet all real packages. tests/unicode-rejection/ is excluded
          # because those files contain intentional violations (tested below).
          for pkg in vocab patterns views charter self-charter w3c site \
                     tests/federation \
                     examples/course-prereqs \
                     examples/project-tracker examples/recipe-ingredients \
                     examples/supply-chain; do
            echo "vet ./$pkg"
            cue vet "./$pkg" -c
          done

      - name: Unicode rejection tests
        run: |
          # These files contain intentional unicode violations.
          # cue vet MUST reject each one (exit code 1).
          PASS=0
          FAIL=0
          for f in tests/unicode-rejection/*.cue; do
            if cue vet "$f" 2>/dev/null; then
              echo "FAIL: $f should have been rejected but passed"
              FAIL=$((FAIL + 1))
            else
              echo "PASS: $f correctly rejected"
              PASS=$((PASS + 1))
            fi
          done
          echo ""
          echo "Unicode rejection: $PASS passed, $FAIL failed"
          if [ "$FAIL" -gt 0 ]; then
            echo "ERROR: Some unicode injection tests were not caught!"
            exit 1
          fi

      - name: Rule violations - report-only passes, Enforce fails
        run: |
          # Without Enforce, violations are reported and cue vet passes
          # (each report-only test also asserts the report contents).
          # With Enforce: true, cue vet must fail.
          for t in compliance-violation charter-incomplete; do
            cue vet -c "./tests/$t/report-only/"
            if cue vet -c "./tests/$t/enforce/" 2>/dev/null; then
              echo "ERROR: tests/$t/enforce passed cue vet; Enforce did not fail the build"
              exit 1
            fi
            echo "ok $t"
          done

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: SHACL reports are consistent (sh:conforms iff no results)
        run: python3 tools/check-shacl-reports.py

      - name: Install W3C validation dependencies
        run: pip install rdflib pyshacl

      - name: W3C round-trip conformance
        run: python3 tools/validate-w3c.py -v

      - name: Validate documentation counts
        run: bash tools/validate-counts.sh

      - name: Check public claims and W3C status wording
        run: bash tools/check-claims.sh

      - name: No hardcoded absolute paths in markdown
        run: |
          # Catch /home/*, /Users/*, /tmp/* paths that sneak into docs.
          FOUND=0
          for f in $(find . -name '*.md' -not -path './.git/*' -not -path './node_modules/*'); do
            if grep -nE '(/home/|/Users/|/tmp/)' "$f"; then
              echo "  ^ in $f"
              FOUND=$((FOUND + 1))
            fi
          done
          if [ "$FOUND" -gt 0 ]; then
            echo ""
            echo "ERROR: $FOUND file(s) contain hardcoded absolute paths"
            exit 1
          fi
          echo "No hardcoded absolute paths found"

      - name: README command smoke test
        run: |
          # Parse and run every cue command from example READMEs (ADR-016).
          PASS=0
          FAIL=0
          for readme in examples/*/README.md; do
            dir="$(dirname "$readme")"
            # Extract lines starting with cue from ```bash blocks
            in_block=false
            while IFS= read -r line; do
              if echo "$line" | grep -q '```bash'; then
                in_block=true
                continue
              fi
              if echo "$line" | grep -q '```'; then
                in_block=false
                continue
              fi
              if $in_block && echo "$line" | grep -qE '^\s*(cue (vet|eval|export))'; then
                cmd=$(echo "$line" | sed 's/^\s*//')
                echo "RUN: $cmd"
                if eval "$cmd" > /dev/null 2>&1; then
                  PASS=$((PASS + 1))
                else
                  echo "  FAIL: $cmd"
                  FAIL=$((FAIL + 1))
                fi
              fi
            done < "$readme"
          done
          echo ""
          echo "README commands: $PASS passed, $FAIL failed"
          if [ "$FAIL" -gt 0 ]; then
            exit 1
          fi

  deploy:
    needs: validate
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - name: Install CUE
        uses: cue-lang/setup-cue@v1.0.1
        with:
          version: v0.15.4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build dependencies
        run: pip install markdown

      - name: Build public site
        run: |
          mkdir -p site/data site/vocab
          cue cmd build-public

      - name: Deploy to Cloudflare Pages
        run: |
          npx wrangler pages project create quicue-apercue --production-branch=main || echo "Project may already exist"
          npx wrangler pages deploy _public --project-name=quicue-apercue --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify the live site serves this build
        run: |
          # The deploy step once failed silently for months (continue-on-error)
          # and apercue.ca kept serving a March 2026 build. Compare the live
          # homepage with the one just built; fail if they never match.
          want=$(sha256sum _public/index.html | cut -d' ' -f1)
          for i in $(seq 1 20); do
            got=$(curl -fsSL "https://apercue.ca/?v=${GITHUB_SHA}" | sha256sum | cut -d' ' -f1 || true)
            if [ "$got" = "$want" ]; then echo "live site matches build"; exit 0; fi
            sleep 15
          done
          echo "ERROR: https://apercue.ca/ does not serve the index.html built from ${GITHUB_SHA}"
          exit 1
